name: Debug PR94 pytest

on:
  push:
    branches:
      - debug/pr94-pytest

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime tools and project
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep tmux
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Capture full pytest log
        run: |
          set +e
          pytest -vv --durations=25 > pytest.log 2>&1
          status=$?
          echo "exit_status=$status" >> pytest.log
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: pr94-pytest-log
          path: pytest.log
