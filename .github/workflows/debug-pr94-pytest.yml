name: Debug PR94 pytest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: debug/pr94-pytest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install runtime tools and project
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep tmux
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Apply compatibility and review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"patch target not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "ui/static/index.html",
              "<title>local-shell-mcp</title>",
              "<title>local-shell-mcp Human Interface</title>",
          )

          replace(
              "ui/src/web.css",
              ".refreshing #refresh-button svg { animation: spin .75s linear infinite; }",
              """:fullscreen .shell,
          .shell:fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 18px;
            border-radius: 0;
          }
          :fullscreen .shell .terminal-card,
          .shell:fullscreen .terminal-card {
            height: calc(100vh - 70px);
            height: calc(100dvh - 70px);
            border-radius: 0;
          }
          .refreshing #refresh-button svg { animation: spin .75s linear infinite; }""",
          )

          replace(
              "ui/src/web.ts",
              """      authGate.hidden = false
                appShell.hidden = true
                stopRefreshTimer()
                return""",
              """      authGate.hidden = false
                appShell.hidden = true
                stopRefreshTimer()
                gateDetail.textContent = "The session expired or this service requires OAuth authentication."
                loginButton.disabled = false
                loginWebButton.disabled = false
                return""",
          )

          replace(
              "ui/src/web.ts",
              """async function copyTerminalSelection(): Promise<void> {
            const selection = terminal?.getSelection()
            if (!selection) return
            await navigator.clipboard.writeText(selection).catch(() => undefined)
          }""",
              """async function copyTerminalSelection(): Promise<void> {
            const selection = terminal?.getSelection()
            if (!selection) return
            try {
              await navigator.clipboard.writeText(selection)
            } catch {
              const textarea = document.createElement("textarea")
              textarea.value = selection
              textarea.style.position = "fixed"
              textarea.style.opacity = "0"
              document.body.appendChild(textarea)
              textarea.select()
              document.execCommand("copy")
              textarea.remove()
              terminal?.focus()
            }
          }""",
          )
          PY
      - name: Build and type-check shared UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
          bun run build
      - name: Run full pytest
        run: |
          set +e
          pytest -vv --durations=25 > /tmp/pytest.log 2>&1
          echo $? > /tmp/pytest.status
          exit 0
      - name: Run browser E2E
        run: |
          set +e
          python scripts/ui-smoke.py > /tmp/ui-smoke.log 2>&1
          echo $? > /tmp/ui-smoke.status
          exit 0
      - name: Publish validated clean commit
        run: |
          test "$(cat /tmp/pytest.status)" = "0"
          test "$(cat /tmp/ui-smoke.status)" = "0"
          rm .github/workflows/debug-pr94-pytest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): preserve legacy contracts and terminal fallbacks"
          git push --force origin HEAD:debug/pr94-validated
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/validated-commit-sha.txt
          cp /tmp/pytest.log /tmp/ui-smoke.log diagnostics/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr94-validation
          path: diagnostics
